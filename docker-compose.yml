services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crypto_trading}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto_net

  # Redis 缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto_net

  # 数据同步服务
  data-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_data_sync
    restart: unless-stopped
    command: ["python", "main.py", "data-sync"]
    environment:
      # 交易所配置
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      BINANCE_SANDBOX: ${BINANCE_SANDBOX:-true}

      # 交易配置
      DEFAULT_SYMBOL: ${DEFAULT_SYMBOL:-BTC/USDT}
      DEFAULT_TIMEFRAME: ${DEFAULT_TIMEFRAME:-1h}
      DEFAULT_EXCHANGE: ${DEFAULT_EXCHANGE:-binance}
      BATCH_SIZE: ${BATCH_SIZE:-1000}
      RATE_LIMIT_DELAY: ${RATE_LIMIT_DELAY:-0.1}

      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crypto_trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-trading_bot:jobs:}

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crypto_net

  # 统一 API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_api
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "damn_rich.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    # 不映射端口，仅容器间访问
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crypto_trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crypto_net

  # 交易执行服务
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_trading_bot
    restart: unless-stopped
    command: ["python", "main.py", "trading-bot"]
    environment:
      # 交易所配置
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      BINANCE_SANDBOX: ${BINANCE_SANDBOX:-true}

      # 交易配置
      DEFAULT_SYMBOL: ${DEFAULT_SYMBOL:-BTC/USDT}
      DEFAULT_TIMEFRAME: ${DEFAULT_TIMEFRAME:-1h}
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-0.1}
      DEFAULT_EXCHANGE: ${DEFAULT_EXCHANGE:-binance}

      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crypto_trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-trading_bot:jobs:}

      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crypto_net

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
      - trading-bot
    networks:
      - crypto_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  crypto_net:
    driver: bridge
