name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'damn-rich' }}/crypto-bot
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # 构建和推送Docker镜像
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 检查构建文件
        run: |
          echo "检查项目文件..."
          ls -la
          echo "检查 pyproject.toml..."
          ls -la pyproject.toml
          echo "检查 uv.lock..."
          ls -la uv.lock
          echo "检查 Dockerfile..."
          ls -la Dockerfile

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 临时禁用缓存来排查问题
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  # 部署到AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 配置AWS凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 部署到EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKER_IMAGE_TAG: ${{ env.DOCKER_IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          # 保存SSH密钥
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 添加主机到known_hosts
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          # 复制部署文件到服务器
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            $EC2_USER@$EC2_HOST:/home/$EC2_USER/crypto-bot/

          # 执行部署命令
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e
            
            # 进入项目目录
            cd /home/$EC2_USER/crypto-bot
            
            # 拉取最新镜像
            docker pull $DOCKER_IMAGE_TAG
            
            # 使用docker-compose更新服务
            export DOCKER_IMAGE=$DOCKER_IMAGE_TAG
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 清理旧镜像
            docker image prune -af --filter "until=72h"
            
            # 显示运行状态
            docker-compose -f docker-compose.prod.yml ps
            
            echo "✅ 部署成功！"
          ENDSSH

      - name: 部署状态通知
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 部署成功完成！"
          else
            echo "❌ 部署失败，请检查日志！"
            exit 1
          fi
