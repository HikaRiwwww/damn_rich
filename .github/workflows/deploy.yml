name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'damn-rich' }}/crypto-bot
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # 构建和推送Docker镜像
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 检查构建文件
        run: |
          echo "检查项目文件..."
          ls -la
          echo "检查 pyproject.toml..."
          ls -la pyproject.toml
          echo "检查 uv.lock..."
          ls -la uv.lock
          echo "检查 Dockerfile..."
          ls -la Dockerfile

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 临时禁用缓存来排查问题
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  # 部署到AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 配置AWS凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 部署到EC2
        id: deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE_TAG: ${{ env.DOCKER_IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          # 调试信息
          echo "EC2_HOST: $EC2_HOST"
          echo "EC2_USER: $EC2_USER"
          echo "EC2_HOST 长度: ${#EC2_HOST}"

          # 测试网络连接
          echo "测试网络连接..."
          ping -c 3 $EC2_HOST || echo "Ping failed, but continuing..."

          # 测试 DNS 解析
          echo "测试 DNS 解析..."
          nslookup $EC2_HOST || echo "DNS lookup failed"

          # 测试端口连接
          echo "测试端口 22..."
          timeout 10 bash -c "</dev/tcp/$EC2_HOST/22" && echo "端口 22 可达" || echo "端口 22 不可达"

          # 保存SSH密钥
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 配置SSH选项
          cat > ~/.ssh/config << EOF
          Host deploy-target
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

          # 添加主机到known_hosts（添加错误处理）
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts || echo "SSH keyscan failed, but continuing..."

          # 创建项目目录
          echo "📁 创建项目目录..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
            "echo '当前用户: \$(whoami)' && echo 'EC2_USER: $EC2_USER' && echo '创建目录: /home/$EC2_USER/crypto-bot' && mkdir -p /home/$EC2_USER/crypto-bot && echo '目录创建成功'"

          # 复制部署文件到服务器
          echo "📁 复制 docker-compose.prod.yml 到服务器..."
          PROJECT_DIR="/home/$EC2_USER/crypto-bot"
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            $EC2_USER@$EC2_HOST:$PROJECT_DIR/ || {
            echo "❌ SCP 复制失败，尝试检查目录权限..."
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
              "ls -la $PROJECT_DIR || echo '目录不存在'"
            exit 1
          }

          # 执行部署命令
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
            set -e
            
            # 设置环境变量
            export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
            export DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN"
            export DOCKER_IMAGE_TAG="$DOCKER_IMAGE_TAG"
            
            echo "🚀 开始部署..."
            echo "📦 镜像标签: \$DOCKER_IMAGE_TAG"
            echo "👤 当前用户: \$(whoami)"
            echo "📁 当前目录: \$(pwd)"
            
            # 进入项目目录
            cd /home/\${USER}/crypto-bot || { echo "❌ 项目目录不存在"; exit 1; }
            
            # 检查 docker-compose.prod.yml 是否存在
            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "❌ docker-compose.prod.yml 文件不存在"
              exit 1
            fi
            
            # 检查 .env 文件是否存在
            if [ ! -f ".env" ]; then
              echo "❌ .env 文件不存在，请先创建环境配置文件"
              echo "📝 需要创建 .env 文件，包含以下配置："
              echo "   BINANCE_API_KEY=your_api_key"
              echo "   BINANCE_SECRET_KEY=your_secret_key"
              echo "   DB_PASSWORD=your_db_password"
              echo "   REDIS_PASSWORD=your_redis_password"
              echo "   DOCKER_IMAGE=\$DOCKER_IMAGE_TAG"
              exit 1
            fi
            
            # 登录 Docker Hub（拉取私有镜像需要）
            echo "🔐 登录 Docker Hub..."
            echo "\$DOCKERHUB_TOKEN" | docker login -u "\$DOCKERHUB_USERNAME" --password-stdin || { echo "❌ Docker Hub 登录失败"; exit 1; }
            
            # 拉取最新镜像
            echo "📥 拉取 Docker 镜像..."
            docker pull \$DOCKER_IMAGE_TAG || { echo "❌ 镜像拉取失败"; exit 1; }
            
            # 使用docker-compose更新服务
            echo "🔄 更新服务..."
            export DOCKER_IMAGE=\$DOCKER_IMAGE_TAG
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans || { echo "❌ 服务启动失败"; exit 1; }
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 10
            
            # 显示运行状态
            echo "📊 服务状态:"
            docker-compose -f docker-compose.prod.yml ps
            
            # 检查服务是否正常运行
            if docker-compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "✅ 部署成功！"
            else
              echo "❌ 服务未正常启动"
              docker-compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
            
            # 清理旧镜像
            echo "🧹 清理旧镜像..."
            docker image prune -af --filter "until=72h" || true
          EOF

      - name: 部署状态通知
        if: always()
        run: |
          echo "📋 部署作业状态: ${{ job.status }}"
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 部署成功完成！"
          else
            echo "❌ 部署失败，请检查上面的日志！"
          fi
