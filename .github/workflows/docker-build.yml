name: Docker Build Test

# 仅用于测试Docker构建，不部署
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建Docker镜像（测试）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: crypto-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 测试镜像
        run: |
          # 运行容器测试
          docker run --rm crypto-bot:test python -c "import sys; print(f'Python version: {sys.version}'); sys.exit(0)"
          echo "✅ Docker镜像构建和测试成功！"
