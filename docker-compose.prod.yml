# 生产环境 Docker Compose 配置
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /var/lib/crypto-bot/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crypto_net

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /var/lib/crypto-bot/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crypto_net

  data-sync:
    image: ${DOCKER_IMAGE}
    container_name: crypto_data_sync
    restart: always
    command: ["python", "main.py", "data-sync"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      USE_REDIS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
    volumes:
      - /var/lib/crypto-bot/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crypto_net

  trading-bot:
    image: ${DOCKER_IMAGE}
    container_name: crypto_trading_bot
    restart: always
    command: ["python", "main.py", "trading-bot"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      USE_REDIS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
    volumes:
      - /var/lib/crypto-bot/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crypto_net

networks:
  crypto_net:
    driver: bridge
