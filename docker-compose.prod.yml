# 生产环境 Docker Compose 配置
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /var/lib/crypto-bot/postgres:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:7150:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crypto_net

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - /var/lib/crypto-bot/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crypto_net

  data-sync:
    image: ${DOCKER_IMAGE:-damn-rich/crypto-bot:latest}
    container_name: crypto_data_sync
    restart: always
    command: ["python", "main.py", "data-sync"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
    volumes:
      - /var/lib/crypto-bot/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crypto_net

  trading-bot:
    image: ${DOCKER_IMAGE:-damn-rich/crypto-bot:latest}
    container_name: crypto_trading_bot
    restart: always
    command: ["python", "main.py", "trading-bot"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
    volumes:
      - /var/lib/crypto-bot/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crypto_net

  # 统一 API 服务
  api:
    image: ${DOCKER_IMAGE:-damn-rich/crypto-bot:latest}
    container_name: crypto_api
    restart: always
    command:
      [
        "uvicorn",
        "damn_rich.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    # 不映射端口，仅容器间访问
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crypto_net

  # 前端服务
  frontend:
    image: ${FRONTEND_IMAGE:-damn-rich/crypto-frontend:latest}
    container_name: crypto_frontend
    restart: always
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - api
      - trading-bot
    networks:
      - crypto_net

networks:
  crypto_net:
    driver: bridge
